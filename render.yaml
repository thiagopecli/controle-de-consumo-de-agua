databases:
  - name: controle-agua-db
    plan: free
    ipAllowList: []

services:
  - type: web
    name: controle-agua
    env: python
    plan: free
    disks:
      - name: media
        mountPath: /var/data
        sizeGB: 1
    buildCommand: "pip install -r requirements.txt; python manage.py collectstatic --noinput; python manage.py migrate; python manage.py create_superuser_if_missing"
    startCommand: "gunicorn hidrometro_project.wsgi:application --workers 1 --threads 4 --worker-class gthread --max-requests 200 --max-requests-jitter 25 --timeout 7200"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: JOB_SECRET_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: controle-agua-db
          property: connectionString

  - type: cron
    name: controle-agua-pregerar-relatorios
    env: python
    plan: free
    # Render usa UTC: 00:00 UTC = 21:00 do dia anterior no horario de Brasilia
    schedule: "0 0 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -c \"import os,requests; token=os.environ['JOB_SECRET_TOKEN']; env_base=os.environ.get('APP_BASE_URL','').strip().rstrip('/'); default_base='https://controle-agua.onrender.com'; base=env_base or default_base; url=f'{base}/jobs/pregerar-relatorios/?sobrescrever=1&intervalo_segundos=5&tentativas=3&permitir_lotes_incompletos=1'; resp=requests.post(url, headers={'X-Job-Token': token}, timeout=14400); print('URL',url); print(resp.status_code); print(resp.text); alt_url=f'{default_base}/jobs/pregerar-relatorios/?sobrescrever=1&intervalo_segundos=5&tentativas=3&permitir_lotes_incompletos=1'; alt=requests.post(alt_url, headers={'X-Job-Token': token}, timeout=14400) if (resp.status_code==404 and env_base and env_base!=default_base) else None; alt and print('URL',alt_url); alt and print(alt.status_code); alt and print(alt.text); (alt or resp).raise_for_status()\""
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: controle-agua-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: JOB_SECRET_TOKEN
        sync: false

  - type: cron
    name: controle-agua-email-mensal
    env: python
    plan: free
    # Render usa UTC: 11:00 UTC = 08:00 no horário de Brasília
    schedule: "0 11 20 * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py enviar_email_mensal --enviar-pdf --sem-fallback-texto --obrigar-relatorios-pregerados --intervalo-segundos 5"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: controle-agua-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false

  - type: cron
    name: controle-agua-precheck-email-mensal
    env: python
    plan: free
    # Render usa UTC: 11:00 UTC = 08:00 no horario de Brasilia
    schedule: "0 11 19 * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py precheck_envio_email_mensal --modo-estrito"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: controle-agua-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false

  - type: cron
    name: controle-agua-auditoria-email-lotes
    env: python
    plan: free
    # Render usa UTC: 11:00 UTC = 08:00 no horario de Brasilia
    schedule: "0 11 18 * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py auditar_email_lotes"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: controle-agua-db
          property: connectionString
