databases:
  - name: controle-agua-db
    plan: free
    ipAllowList: []

services:
  - type: web
    name: controle-agua
    env: python
    plan: free
    disks:
      - name: media
        mountPath: /var/data
        sizeGB: 1
    buildCommand: "pip install -r requirements.txt; python manage.py collectstatic --noinput; python manage.py migrate; python manage.py create_superuser_if_missing"
    startCommand: "gunicorn hidrometro_project.wsgi:application --workers 1 --threads 1 --worker-class gthread --max-requests 200 --max-requests-jitter 25 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: JOB_SECRET_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: controle-agua-db
          property: connectionString

  - type: cron
    name: controle-agua-pregerar-relatorios
    env: python
    plan: free
    # Render usa UTC: 10:00 UTC = 07:00 no horario de Brasilia
    schedule: "0 10 15 * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -c \"import os,requests; base=os.environ['APP_BASE_URL'].rstrip('/'); token=os.environ['JOB_SECRET_TOKEN']; url=f'{base}/jobs/pregerar-relatorios/?sobrescrever=1&intervalo_segundos=3&tentativas=3'; resp=requests.post(url, headers={'X-Job-Token': token}, timeout=1800); print(resp.status_code); print(resp.text); resp.raise_for_status()\""
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: controle-agua-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: JOB_SECRET_TOKEN
        sync: false

  - type: cron
    name: controle-agua-whatsapp-mensal
    env: python
    plan: free
    # Render usa UTC: 11:00 UTC = 08:00 no horário de Brasília
    schedule: "0 11 20 * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py enviar_whatsapp_mensal --enviar-pdf --intervalo-segundos 5"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: controle-agua-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: ZAPI_INSTANCE_ID
        sync: false
      - key: ZAPI_INSTANCE_TOKEN
        sync: false
      - key: ZAPI_CLIENT_TOKEN
        sync: false
      - key: ZAPI_WHATSAPP_TO
        sync: false

  - type: cron
    name: controle-agua-precheck-whatsapp-mensal
    env: python
    plan: free
    # Render usa UTC: 11:00 UTC = 08:00 no horario de Brasilia
    schedule: "0 11 19 * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py precheck_envio_whatsapp_mensal --modo-estrito"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: controle-agua-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: ZAPI_INSTANCE_ID
        sync: false
      - key: ZAPI_INSTANCE_TOKEN
        sync: false
      - key: ZAPI_CLIENT_TOKEN
        sync: false

  - type: cron
    name: controle-agua-auditoria-whatsapp-lotes
    env: python
    plan: free
    # Render usa UTC: 11:00 UTC = 08:00 no horario de Brasilia
    schedule: "0 11 18 * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py auditar_whatsapp_lotes"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: controle-agua-db
          property: connectionString
